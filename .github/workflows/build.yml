name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o NoDCompanion_project.zip

      - name: Install Gradle 8.9
        run: |
          curl -L --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: NoDCompanion
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NoDCompanion-APK
          path: NoDCompanion/app/build/outputs/apk/debug/app-debug.apk
